name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# NOTE:
# This repo is a hobby/proof workspace. CI is intentionally minimal and should be robust
# against upstream GitHub Action churn.
#
# We keep Pages permissions because other workflows may publish artifacts, but this CI job
# does not currently deploy docs.
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: install uv (for table regen-check)
        uses: astral-sh/setup-uv@v3
      - uses: leanprover/lean-action@v1
        with:
          # Make this explicit (we are downstream of mathlib).
          use-mathlib-cache: true
      - name: lint-style (check)
        run: |
          ./Scripts/check.sh ci --github
      # Docs generation is currently disabled:
      # - `docgen-action` was failing due to looking for `lakefile.toml` (this repo uses `lakefile.lean`).
      # - Re-enable once we either add a `lakefile.toml` or switch to an invocation that reads `lakefile.lean`.
      # - uses: leanprover-community/docgen-action@v1

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: codespell-project/actions-codespell@v2
        with:
          # Keep this narrow: docs + Lean sources, skip build artifacts.
          path: "README.md,doc,docs,GeometryOfNumbers,Experiments,Scripts"
          skip: ".lake,./.git"
