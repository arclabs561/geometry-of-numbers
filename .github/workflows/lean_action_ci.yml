name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          # Make this explicit (we are downstream of mathlib).
          use-mathlib-cache: true
      - name: lint-style (check)
        run: |
          ./Scripts/run_lint_style.sh --github
      - uses: leanprover-community/docgen-action@v1

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rhysd/actionlint-action@v1

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: codespell-project/actions-codespell@v2
        with:
          # Keep this narrow: docs + Lean sources, skip build artifacts.
          path: "README.md,doc,docs,Covolume,Experiments,Scripts"
          skip: ".lake,./.git"
