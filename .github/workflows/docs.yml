name: Docs (doc-gen4)

on:
  # Doc generation is expensive (it builds docs for imported dependencies too).
  # Keep it manual by default.
  workflow_dispatch:

# Docs are useful but should not destabilize the main CI workflow.
permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: install elan
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan-init.tar.gz
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  /tmp/elan-init.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/elan-init.tar.gz --directory /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: restore Mathlib cache
        run: |
          "$HOME/.elan/bin/lake" exe cache get
      - name: build and lint
        run: |
          "$HOME/.elan/bin/lake" build
          "$HOME/.elan/bin/lake" lint

      - name: build docs (GeometryOfNumbers)
        run: |
          cd docbuild
          MATHLIB_NO_CACHE_ON_UPDATE=1 "$HOME/.elan/bin/lake" update
          "$HOME/.elan/bin/lake" build GeometryOfNumbers:docs

      - name: upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-gen4-html
          path: docbuild/.lake/build/doc
