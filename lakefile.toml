name = "polygonal-number-theorem"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["PolygonalNumberTheorem"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Note: `lakefile.lean` is authoritative for mathlib in this repo.
# Keep this in sync to avoid accidental divergence.
rev = "cced109deab25b4322e1a12b877335e092322b74"

[[lean_lib]]
name = "PolygonalNumberTheorem"
